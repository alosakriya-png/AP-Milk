<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b45"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><title>AP MILK</title>
<style>
:root{font-family:system-ui,Arial;color:#183326;background:#f3f7f3}*{box-sizing:border-box}
body{margin:0}header{background:#176b45;color:white;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:26px}header small{display:block;margin-top:4px}
main{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}
label{display:block;font-size:14px;margin:9px 0 4px}input,select,button{font:inherit;padding:11px;border:1px solid #cbd8ce;border-radius:9px;width:100%}
button{background:#176b45;color:white;border:0;font-weight:650;margin-top:10px}button.secondary{background:#e7f1e9;color:#145638}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#607267;font-size:13px}
.stat{font-size:22px;font-weight:750}.entry{border-top:1px solid #e5ece6;padding:9px 0}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button{width:auto;flex:1}
@media(max-width:480px){.row{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header><h1>🐄 AP MILK</h1><small>दूध हिसाब किताब • Developed by: AP</small></header>
<main>
<div class="card"><div class="row">
<div><div class="muted">कुल दूध (लीटर)</div><div class="stat" id="totalLitres">0</div></div>
<div><div class="muted">कुल रकम</div><div class="stat" id="totalMoney">₹0</div></div>
</div></div>
<div class="card"><h3>ग्राहक / Customer</h3>
<div class="row"><div><label>ग्राहक का नाम</label><input id="customer" placeholder="नाम"></div><div><label>कोड नंबर</label><input id="code" placeholder="जैसे 101"></div></div>
<div class="row"><div><label>तारीख</label><input id="date" type="date"></div><div><label>समय</label><select id="session"><option>सुबह</option><option>शाम</option></select></div></div>
<div class="row"><div><label>दूध (लीटर)</label><input id="litres" type="number" step="0.01" min="0" placeholder="0"></div><div><label>रेट / लीटर (₹)</label><input id="rate" type="number" step="0.01" min="0" value="60"></div></div>
<button id="save">एंट्री सेव करें</button><p class="muted" id="notice">डेटा इसी मोबाइल में सेव होता है। ऑफलाइन भी काम करता है।</p>
</div>
<div class="card"><h3>हिसाब / Records</h3>
<input id="search" placeholder="नाम या कोड से खोजें">
<div id="records"></div>
<div class="row"><button class="secondary" id="share">WhatsApp / Share बिल</button><button class="secondary" id="export">Backup डाउनलोड</button></div>
<label>Backup वापस लाएँ</label><input type="file" id="restore" accept="application/json">
</div>
<div class="card"><h3>सारांश / Summary</h3><div class="row"><div><label>इस सप्ताह की रकम</label><div class="stat" id="weekly">₹0</div></div><div><label>इस महीने की रकम</label><div class="stat" id="monthly">₹0</div></div></div></div>
<footer class="muted" style="text-align:center;padding:14px">AP MILK • Developed by AP</footer>
</main>
<script src="app.js"></script>
</body></html>
